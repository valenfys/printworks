name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: printworks

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
          # A single Apple-Silicon runner cross-builds both macOS
          # architectures (Xcode's toolchain supports both targets
          # natively), since dedicated Intel (macos-13) runners are
          # scarce/deprecated on GitHub's hosted fleet and can queue
          # indefinitely.
          - os: macos-14
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            targets: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build, package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          IFS=',' read -ra targets <<< "${{ matrix.targets }}"
          for target in "${targets[@]}"; do
            cargo build --release --locked --target "$target"
            staging="${BIN_NAME}-${{ github.ref_name }}-${target}"
            mkdir "$staging"
            cp "target/${target}/release/${BIN_NAME}" "$staging/"
            cp README.md "$staging/"
            tar czf "dist/${staging}.tar.gz" "$staging"
            rm -rf "$staging"
          done

      - name: Build, package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          foreach ($target in "${{ matrix.targets }}".Split(",")) {
            cargo build --release --locked --target $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $staging = "${env:BIN_NAME}-${{ github.ref_name }}-$target"
            New-Item -ItemType Directory -Path $staging | Out-Null
            Copy-Item "target/$target/release/${env:BIN_NAME}.exe" $staging/
            Copy-Item README.md $staging/
            Compress-Archive -Path $staging -DestinationPath "dist/${staging}.zip"
            Remove-Item -Recurse -Force $staging
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
