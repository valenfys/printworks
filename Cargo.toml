[package]
name = "printworks"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Convert camera RAW photos to full-resolution JPEGs"
repository = "https://github.com/valenfys/printworks"
readme = "README.md"
exclude = ["examples/raw/*.CR2", "examples/raw/*.NEF", "examples/raw/*.RW2", "examples/raw/*.ARW"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
image = "0.25.10"
imagepipe = "0.5.1"
indicatif = "0.18.6"
kamadak-exif = "0.6.1"
little_exif = "0.6.23"
log = "0.4.34"
rawloader = "0.37.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
